<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Castelo Gaylord</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas { display: block; position: fixed; inset: 0; }

  #controls {
    position: fixed; left: 0; right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 calc(18px + env(safe-area-inset-left)) 0 calc(18px + env(safe-area-inset-right));
    pointer-events: none; z-index: 5;
  }
  .btn {
    pointer-events: auto; width: 82px; height: 82px; border-radius: 50%;
    background: rgba(20, 16, 30, .35); border: 2px solid rgba(255, 236, 190, .7);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: transform .08s, background .08s;
  }
  .btn svg { width: 44%; height: 44%; fill: #fff3d6; }
  .btn.fwd { width: 96px; height: 96px; margin-bottom: 26px; }
  .btn.on { background: rgba(255, 200, 90, .5); transform: scale(.93); }

  #msg {
    position: fixed; top: 16%; left: 50%; transform: translateX(-50%);
    color: #fff3d6; font-size: clamp(20px, 6vw, 34px); text-align: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .9), 0 0 24px rgba(255, 190, 80, .6);
    letter-spacing: .06em; opacity: 0; transition: opacity .8s; pointer-events: none;
    width: 90%; z-index: 4;
  }
  #msg.show { opacity: 1; }

  #start {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(40, 20, 60, .85), rgba(0, 0, 0, .95));
    color: #fff3d6; text-align: center; padding: 24px; box-sizing: border-box;
  }
  #start h1 {
    font-size: clamp(36px, 12vw, 72px); margin: 0 0 8px; letter-spacing: .12em;
    color: #ffd36b; text-shadow: 0 0 20px rgba(255, 190, 60, .7), 0 3px 0 #6b3d00;
  }
  #start p { font-size: clamp(15px, 4.4vw, 20px); opacity: .9; margin: 6px 0; max-width: 460px; line-height: 1.4; }
  #start .tap {
    margin-top: 28px; padding: 14px 30px; border: 2px solid #ffd36b; border-radius: 40px;
    font-size: 20px; color: #ffd36b; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body>

<div id="start">
  <h1>GAYLORD</h1>
  <p>Siga o caminho pela floresta até o castelo.</p>
  <p>Use as setas na parte de baixo da tela para andar e virar.</p>
  <div class="tap">Toque para começar</div>
</div>

<div id="msg"></div>

<div id="controls">
  <div class="btn" data-k="l"><svg viewBox="0 0 24 24"><path d="M16 3 L5 12 L16 21 Z"/></svg></div>
  <div class="btn fwd" data-k="f"><svg viewBox="0 0 24 24"><path d="M12 3 L22 17 L2 17 Z"/></svg></div>
  <div class="btn" data-k="r"><svg viewBox="0 0 24 24"><path d="M8 3 L19 12 L8 21 Z"/></svg></div>
</div>

(() => {
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- Renderer / cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const OUT_FOG = new THREE.Color(0xc4def0), IN_FOG = new THREE.Color(0x140c1c);
scene.fog = new THREE.Fog(OUT_FOG.clone(), 40, 300);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1200);
camera.rotation.order = 'YXZ';

const hemi = new THREE.HemisphereLight(0xd8ecff, 0x46632a, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 0.85);
sun.position.set(60, 100, 40);
scene.add(sun);

// ---------- Texturas procedurais ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
function withRepeat(tex, rx, ry) {
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t;
}

const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4d7d31'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = `hsl(${95 + rnd(-18, 18)},${45 + rnd(-12, 12)}%,${30 + rnd(-10, 14)}%)`;
    g.fillRect(rnd(0, w), rnd(0, h), rnd(1, 2), rnd(2, 5));
  }
}, [100, 100]);

const dirtTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8c6c45'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    g.fillStyle = `hsl(${30 + rnd(-6, 6)},${35 + rnd(-10, 10)}%,${36 + rnd(-12, 12)}%)`;
    g.fillRect(rnd(0, w), rnd(0, h), rnd(1, 3), rnd(1, 3));
  }
  for (let i = 0; i < 60; i++) {
    g.fillStyle = `hsl(30,8%,${50 + rnd(-10, 15)}%)`;
    g.beginPath(); g.ellipse(rnd(0, w), rnd(0, h), rnd(2, 5), rnd(2, 4), rnd(0, 3), 0, 7); g.fill();
  }
});

const brickTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4a4540'; g.fillRect(0, 0, w, h);
  const rows = 8, bh = h / rows, bw = w / 4;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * bw / 2;
    for (let x = -bw; x < w; x += bw) {
      const l = 52 + rnd(-10, 8);
      g.fillStyle = `hsl(${30 + rnd(-8, 8)},${5 + rnd(0, 6)}%,${l}%)`;
      g.fillRect(x + off + 2, r * bh + 2, bw - 4, bh - 4);
      for (let i = 0; i < 25; i++) {
        g.fillStyle = `rgba(0,0,0,${rnd(0.03, 0.12)})`;
        g.fillRect(x + off + rnd(2, bw - 4), r * bh + rnd(2, bh - 4), 2, 2);
      }
    }
  }
});

const tileTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3a3430'; g.fillRect(0, 0, w, h);
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    g.fillStyle = (i + j) % 2 ? `hsl(35,12%,${38 + rnd(-4, 4)}%)` : `hsl(35,10%,${56 + rnd(-4, 4)}%)`;
    g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
});

const woodTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#5a3a1e'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 32) {
    g.fillStyle = `hsl(28,${45 + rnd(-8, 8)}%,${22 + rnd(-4, 5)}%)`;
    g.fillRect(x + 1, 0, 30, h);
    for (let i = 0; i < 30; i++) {
      g.strokeStyle = `rgba(0,0,0,${rnd(.08, .2)})`;
      g.beginPath(); const xx = x + rnd(3, 29); g.moveTo(xx, 0); g.lineTo(xx + rnd(-2, 2), h); g.stroke();
    }
  }
  g.fillStyle = '#2a2a2a';
  g.fillRect(0, 40, w, 8); g.fillRect(0, h - 48, w, 8);
});

function glowTex(inner, outer) {
  const t = canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, inner); gr.addColorStop(0.35, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
const flameTex = glowTex('rgba(255,255,220,1)', 'rgba(255,140,30,.7)');
const haloTex = glowTex('rgba(255,240,180,.9)', 'rgba(255,190,70,.35)');

// ---------- Céu ----------
{
  const skyTex = canvasTex(4, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#3a7bd5'); gr.addColorStop(0.45, '#8fc3ee'); gr.addColorStop(0.52, '#d9ecf7'); gr.addColorStop(1, '#d9ecf7');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  skyTex.wrapS = skyTex.wrapT = THREE.ClampToEdgeWrapping;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
  scene.add(sky);

  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
  sunSprite.position.set(180, 300, -400); sunSprite.scale.set(160, 160, 1);
  scene.add(sunSprite);

  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x777777, fog: false });
  const cloudGeo = new THREE.SphereGeometry(1, 10, 8);
  for (let i = 0; i < 18; i++) {
    const c = new THREE.Group();
    const a = rnd(0, Math.PI * 2), d = rnd(150, 400);
    c.position.set(Math.cos(a) * d, rnd(90, 150), Math.sin(a) * d);
    for (let j = 0; j < 5; j++) {
      const p = new THREE.Mesh(cloudGeo, cloudMat);
      p.position.set(rnd(-18, 18), rnd(-3, 4), rnd(-8, 8));
      const s = rnd(8, 15); p.scale.set(s * 1.4, s * 0.6, s);
      c.add(p);
    }
    scene.add(c);
  }

  // montanhas ao longe
  const mMat = new THREE.MeshLambertMaterial({ color: 0x6f8a78 });
  const snowMat = new THREE.MeshLambertMaterial({ color: 0xf4f8ff });
  for (let i = 0; i < 22; i++) {
    const a = (i / 22) * Math.PI * 2 + rnd(-.1, .1), d = rnd(230, 290);
    const h = rnd(50, 110), r = rnd(40, 70);
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mMat);
    m.position.set(Math.cos(a) * d, h / 2 - 2, Math.sin(a) * d);
    scene.add(m);
    const s = new THREE.Mesh(new THREE.ConeGeometry(r * 0.3, h * 0.3, 7), snowMat);
    s.position.set(m.position.x, h - h * 0.15 - 1.9, m.position.z);
    scene.add(s);
  }
}

const smooth = t => t * t * (3 - 2 * t);
const pathX = z => 7 * Math.sin(z * 0.045) * smooth(clamp((z + 92) / 25, 0, 1));
const PATH_W = 1.9;
{
  const pos = [], uv = [], idx = [];
  let n = 0;
  for (let z = 64; z >= -100; z -= 1) {
    const cx = pathX(z);
    pos.push(cx - PATH_W, 0.03, z, cx + PATH_W, 0.03, z);
    uv.push(0, z * 0.25, 1, z * 0.25);
    if (n > 0) { const a = (n - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    n++;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const tex = withRepeat(dirtTex, 1, 1);
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide })));
}

const dummy = new THREE.Object3D();
{
  const rocks = [];
  for (let z = 62; z > -96; z -= 2.2) {
    for (const side of [-1, 1]) {
      if (Math.random() < 0.25) continue;
      rocks.push([pathX(z) + side * (PATH_W + rnd(0.2, 0.6)), z + rnd(-.6, .6), rnd(0.18, 0.4)]);
    }
  }
  const rockMesh = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0),
    new THREE.MeshLambertMaterial({ color: 0x8a8580 }), rocks.length);
  rocks.forEach(([x, z, s], i) => {
    dummy.position.set(x, s * 0.4, z); dummy.rotation.set(rnd(0, 3), rnd(0, 3), 0);
    dummy.scale.set(s * 1.3, s, s); dummy.updateMatrix(); rockMesh.setMatrixAt(i, dummy.matrix);
  });
  scene.add(rockMesh);

  const trees = [];
  let tries = 0;
  while (trees.length < 230 && tries++ < 5000) {
    const x = rnd(-110, 110), z = rnd(-190, 80);
    if (Math.abs(x - pathX(clamp(z, -100, 64))) < 6 && z > -100) continue;
    if (Math.abs(x) < 32 && z < -88 && z > -145) continue;      // clareira do castelo
    if (Math.abs(x) < 10 && z < -95) continue;                   // entrada do castelo
    if (Math.abs(x - pathX(64)) < 6 && z > 60) continue;          // ponto de partida
    trees.push([x, z, rnd(0.8, 1.6)]);
  }
  const N = trees.length;
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.38, 2, 6),
    new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), N);
  const leaves = new THREE.InstancedMesh(new THREE.ConeGeometry(1.8, 3.6, 7),
    new THREE.MeshLambertMaterial({ color: 0xffffff }), N * 3);
  const col = new THREE.Color();
  trees.forEach(([x, z, s], i) => {
    dummy.rotation.set(0, rnd(0, 6), 0);
    dummy.position.set(x, s, z); dummy.scale.setScalar(s); dummy.updateMatrix();
    trunk.setMatrixAt(i, dummy.matrix);
    col.setHSL(0.28 + rnd(-0.04, 0.04), 0.5, 0.22 + rnd(-0.05, 0.06));
    for (let k = 0; k < 3; k++) {
      dummy.position.set(x, (2.5 + k * 1.3) * s, z); dummy.scale.setScalar(s * (1 - k * 0.22));
      dummy.updateMatrix(); leaves.setMatrixAt(i * 3 + k, dummy.matrix); leaves.setColorAt(i * 3 + k, col);
    }
    addCol(x - 0.45 * s, x + 0.45 * s, z - 0.45 * s, z + 0.45 * s);
  });
  scene.add(trunk, leaves);

  const flowers = [];
  for (let i = 0; i < 400; i++) {
    const z = rnd(-95, 64), x = pathX(z) + (Math.random() < .5 ? -1 : 1) * rnd(2.6, 14);
    flowers.push([x, z]);
  }
  const fl = new THREE.InstancedMesh(new THREE.SphereGeometry(0.12, 6, 4),
    new THREE.MeshBasicMaterial({ color: 0xffffff }), flowers.length);
  const palette = [0xff5a7a, 0xffd23f, 0xffffff, 0xb57bff, 0xff8f3f].map(c => new THREE.Color(c));
  flowers.forEach(([x, z], i) => {
    dummy.position.set(x, 0.15, z); dummy.scale.setScalar(rnd(0.7, 1.3)); dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix(); fl.setMatrixAt(i, dummy.matrix); fl.setColorAt(i, palette[i % palette.length]);
  });
  scene.add(fl);
}

// ---------- Foto (mar.png) ----------
function applyPhoto(src) {
  const tex = src instanceof HTMLCanvasElement ? new THREE.CanvasTexture(src) : new THREE.Texture(src);
  tex.needsUpdate = true;
  tex.minFilter = THREE.LinearFilter;
  const m = window.__photoMat;
  m.map = tex; m.color.set(0xffffff); m.needsUpdate = true;
  const w = src.width, h = src.height;
  if (w && h) {
    const a = w / h;
    window.__photoMesh.scale.set(a >= 1 ? 1 : a, a >= 1 ? 1 / a : 1, 1);
  }
}
(function loadPhoto() {
  let done = false;
  const fallback = () => {
    if (done) return; done = true;
    if (MAR_FALLBACK.startsWith('data:')) { const f = new Image(); f.onload = () => applyPhoto(f); f.src = MAR_FALLBACK; }
  };
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      g.getImageData(0, 0, 1, 1); // lança erro se a imagem estiver "contaminada" (file://)
      done = true; applyPhoto(c);
    } catch (e) { fallback(); }
  };
  img.onerror = fallback;
  img.src = 'mar.png';
})();

  b.addEventListener('lostpointercapture', off);
});

  return false;
}

let started = false, insideT = 0;
document.getElementById('start').addEventListener('pointerdown', () => {
  document.getElementById('start').style.display = 'none';
  started = true;
  try { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen).call(d).catch?.(() => {}); } catch (_) {}
  say('Siga o caminho até o castelo');
});

// ---------- Loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (started) {
    if (input.l) player.yaw += TURN * dt;
    if (input.r) player.yaw -= TURN * dt;
    if (input.f) {
      const dx = -Math.sin(player.yaw) * SPEED * dt, dz = -Math.cos(player.yaw) * SPEED * dt;
      if (!blocked(player.x + dx, player.z)) player.x += dx;
      if (!blocked(player.x, player.z + dz)) player.z += dz;
      player.bob += dt * 9;
    } else {
      player.bob = lerp(player.bob, Math.round(player.bob / Math.PI) * Math.PI, 0.1);
    }
  }

  const inside = player.x > -19 && player.x < 19 && player.z < IZ0 && player.z > IZ1;
  insideT = clamp(insideT + (inside ? dt : -dt) * 0.8, 0, 1);

  // olhar suavemente para a foto quando estiver dentro do salão e virado para o altar
  let targetPitch = 0;
  if (inside) {
    const vx = ALTAR.x - player.x, vz = ALTAR.z - player.z, d = Math.hypot(vx, vz);
    const facing = Math.max(0, (-Math.sin(player.yaw) * vx - Math.cos(player.yaw) * vz) / d);
    targetPitch = clamp(Math.atan2(ALTAR.y - EYE, Math.max(d, 1)), 0, 0.45) * facing * facing;
  }
  player.pitch = lerp(player.pitch, targetPitch, 0.06);

  camera.position.set(player.x, EYE + Math.sin(player.bob) * 0.06, player.z);
  camera.rotation.set(player.pitch, player.yaw, Math.sin(player.bob * 0.5) * 0.006);

  // iluminação muda ao entrar no castelo
  hemi.intensity = lerp(0.95, 0.28, insideT);
  sun.intensity = lerp(0.85, 0.12, insideT);
  scene.fog.color.copy(OUT_FOG).lerp(IN_FOG, insideT);
  scene.fog.near = lerp(40, 12, insideT);
  scene.fog.far = lerp(300, 70, insideT);

  // gatilhos de mensagem
  if (started) {
    if (!said.near && player.z < -55) { said.near = 1; say('O castelo GAYLORD se aproxima…'); }
    if (!said.in && inside) { said.in = 1; say('Você entrou no castelo'); }
    if (!said.altar && inside && Math.hypot(player.x - ALTAR.x, player.z - ALTAR.z) < 9) { said.altar = 1; say('✦ O Altar ✦', 4500); }
  }

  // animações
  for (const f of flames) {
    if (f.halo) { f.halo.material.opacity = 0.6 + Math.sin(t * 1.5) * 0.2; continue; }
    const k = 1 + Math.sin(t * 13 + f.ph) * 0.08 + Math.sin(t * 7.3 + f.ph * 2) * 0.06;
    f.s.scale.set(f.base * k, f.base * 1.5 * k, 1);
    if (f.l) f.l.intensity = f.bl * k;
  }
  for (let i = 0; i < flags.length; i++) {
    const p = flags[i].geometry.attributes.position;
    for (let j = 0; j < p.count; j++) {
      const x = p.getX(j) + 1;
      p.setZ(j, Math.sin(t * 5 + x * 2.5 + i) * 0.18 * x);
    }
    p.needsUpdate = true;
  }
  for (let i = 0; i < SPARKS; i++) {
    let y = sparkPos[i * 3 + 1] + dt * 0.35;
    if (y > 8.5) y = 0.5;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3] += Math.sin(t + i) * dt * 0.1;
  }
  sparkGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

frame();
})();
</script>
