<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6fb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .botao {
      display: inline-block;
      padding: 18px 40px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      background: #1a73e8;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
      transition: background 0.2s, transform 0.1s;
    }
    .botao:hover {
      background: #1558b0;
    }
    .botao:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <a class="botao" href="https://forms.gle/UcY1eMYUDY3roz4Y6" target="_self">Abrir Pesquisa</a>
</body>
</html>
