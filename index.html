<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Google - EE Dr. Arnaldo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <main class="layout">
     <div class="coluna-principal">
      <section class="card">
        <h2 class="step-title">1. Selecione a sua turma</h2>
        <label for="serie">Série/Turma</label>
        <select id="serie">
          <option value="">Carregando turmas...</option>
        </select>
      </section>

      <section class="card">
        <h2 class="step-title">2. Encontre o seu nome</h2>

        <div id="studentsPlaceholder" class="placeholder-text">
          <p>Selecione uma turma acima para carregar a lista.</p>
        </div>

        <div id="studentsView" class="hidden">
          <label for="search">Buscar estudante</label>
          <input id="search" placeholder="Digite o nome ou e-mail..." />

          <div class="info-row">
            <div class="pill highlight" id="seriePill"></div>
            <div class="pill" id="shownPill"></div>
          </div>

          <div class="list" id="list"></div>
        </div>
      </section>
     </div>

     <aside class="coluna-lateral">
      <section class="card">
        <h2 class="step-title">Acessos</h2>
        <div class="acessos">
          <button id="btnAbrirLink" class="btn-acesso">Link do Professor</button>
          <button id="btnAbrirJogos" class="btn-acesso">Jogos</button>
        </div>
      </section>
     </aside>
    </main>

    <footer>
      EE Dr. Arnaldo Estevão de Figueiredo &middot; Figueirão - MS
    </footer>
  </div>

  <!-- MODAL DE JOGOS -->
  <div id="jogosModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-head">
        <h3>Jogos disponíveis</h3>
        <button id="btnFecharJogos" class="btn-fechar">Fechar</button>
      </div>
      <div id="jogosPlaceholder" class="placeholder-text">
        <p>Carregando jogos...</p>
      </div>
      <div class="jogos-grid" id="jogosGrid"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
